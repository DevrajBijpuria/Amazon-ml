# Phase 3 experiment P3-B: same rules as P3-A (B0 + house_locality, postal_locality, state_locality,
# address_signature); only the per-S1 cap changes, to 150 (cap sensitivity).
# Everything else is the frozen Phase 2.5 value.
# HGB is retrained on this experiment's own training candidates; the threshold is re-selected on validation.
# Relative paths resolve against the repository root.
experiment_id: p3_locality_cap150
seed: 42
n_jobs: 6

paths:
  data_root: dataset
  phase3_dir: phase3/output
  baseline_dir: phase2/output/phase2_5/frozen_50000   # immutable rollback baseline, read only
  validator: utils/validate_submission.py
  validator_shard_rows: 100000

candidate_generation:
  use_country_block: true
  use_exact_name_block: true
  use_exact_address_block: true
  use_numeric_block: true
  use_name_prefix_block: true
  use_address_prefix_block: true
  use_name_char_ngram_block: true
  use_name_phonetic_block: true          # B0: consonant skeleton of the whole core name
  use_address_token_block: true
  use_house_locality_block: true         # frozen Phase 2.5
  use_state_locality_block: true         # frozen Phase 2.5
  use_address_signature_block: true      # frozen Phase 2.5
  use_postal_locality_block: true        # Phase 3 addition
  use_name_phonetic_token_block: false   # P3-D only
  name_prefix_length: 8
  address_prefix_length: 12
  rare_tokens_per_name: 2
  rare_tokens_per_address: 2
  max_block_size: 100
  max_candidates_per_source1: 150
  source1_chunk_size: 25000

features:
  name: {char_ngram: true, token_jaccard: true, edit_similarity: true, normalized_exact: true}
  address: {char_ngram: true, token_jaccard: true, edit_similarity: true, normalized_exact: true}
  structural: {country_equal: true, name_missing: true, address_missing: true,
               house_number_equal: true, postal_code_equal: true}
  exclude: [matched_by_exact_name_block, matched_by_exact_address_block, matched_by_numeric_block,
            matched_by_prefix_block, matched_by_ngram_block]   # F3 = 42 features

model:
  type: hist_gradient_boosting
  C: 1.0            # unused by gradient boosting (kept: the Phase 2 trainer reads the key)
  max_iter: 200     # random_state = seed, early_stopping = false (fixed in phase2 matching_model.py)

training:
  source1_sample: 50000

threshold:
  default: null
  grid_start: 0.05
  grid_stop: 0.95
  grid_step: 0.05

validation:
  negative_ratio: 5
  hard_negative_fraction: 0.5
  validation_fraction: 0.2
